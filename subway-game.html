<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
body{margin:0;background:#0f0f0f;font-family:Arial;overflow:hidden}
#gameWrap{width:100%;max-width:420px;height:100vh;margin:auto;background:linear-gradient(#4facfe 0%, #87CEEB 40%, #555 100%);position:relative;overflow:hidden;perspective:500px}
#track{position:absolute;bottom:0;width:100%;height:100%;background:repeating-linear-gradient(90deg, #444 0 10%, #666 10% 11%, #333 11% 33%);transform:rotateX(65deg);transform-origin:bottom; }
#city{position:absolute;top:0;width:200%;height:35%;background:url('https://i.imgur.com/8Km9tLL.png');animation:moveCity 10s linear infinite;opacity:0.8}
@keyframes moveCity{from{left:0}to{left:-50%}}
.lane-obj{position:absolute;transform:translateX(-50%);will-change:top,transform}
#player{position:absolute;bottom:12%;left:50%;font-size:55px;z-index:100;transform:translateX(-50%);transition:left 0.2s}
#ui{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;padding:12px;box-sizing:border-box;color:white;font-weight:bold;z-index:200;text-shadow:0 2px 4px black}
button{padding:14px;border-radius:12px;border:none;font-weight:bold}
.ctrl{position:absolute;bottom:0;width:100%;display:flex;justify-content:space-around;padding:10px;box-sizing:border-box;z-index:200}
</style>
</head>
<body>
<div id="gameWrap">
<div id="ui"><div>⭐ <span id="score">0</span></div><div>🪙 <span id="coins">0</span></div></div>
<div id="track"></div>
<div id="player">🏃‍♂️</div>
<div class="ctrl">
<button onclick="moveLane(-1)" style="background:#ffcc00">⬅️</button>
<button onclick="jump()" style="background:#00ff88">⬆️ JUMP</button>
<button onclick="moveLane(1)" style="background:#ffcc00">➡️</button>
</div>
</div>
<script>
let lane=1, score=0, coins=0, objs=[], playing=true, jumpT=0;
const laneX=[25,50,75];
const player=document.getElementById('player');
const wrap=document.getElementById('gameWrap');
function moveLane(d){ lane=Math.max(0,Math.min(2,lane+d)); player.style.left=laneX[lane]+'%'; }
function jump(){ if(jumpT==0){jumpT=30; player.textContent='🦸‍♂️'} }
function spawn(){
 let type=Math.random()<0.65?'coin':'train';
 let l=Math.floor(Math.random()*3);
 let el=document.createElement('div'); el.className='lane-obj';
 el.style.left=laneX[l]+'%'; el.dataset.l=l;
 el.innerHTML= type=='coin'? '🪙' : '🚃';
 el.style.top='15%'; el.style.fontSize='10px'; el.style.zIndex=1;
 wrap.appendChild(el); objs.push({el,y:15,scale:0.2,l,type});
}
function loop(){
 if(!playing) return;
 if(Math.random()<0.07) spawn();
 for(let i=objs.length-1;i>=0;i--){
  let o=objs[i]; o.y+=1.2+score/500; o.scale=o.y/100;
  o.el.style.top=o.y+'%'; o.el.style.fontSize=(10+o.scale*40)+'px';
  o.el.style.zIndex=Math.floor(o.y);
  if(o.y>70 && o.y<85 && o.l==lane){
   if(o.type=='coin' && jumpT<20){ coins++; score+=10; o.el.remove(); objs.splice(i,1); document.getElementById('coins').innerText=coins; continue; }
   if(o.type=='train' && jumpT==0){ playing=false; alert('GAME OVER! Score:'+score); location.reload(); return; }
  }
  if(o.y>92){ if(o.type=='train'){score+=10; document.getElementById('score').innerText=score;} o.el.remove(); objs.splice(i,1); }
 }
 if(jumpT>0){jumpT--; player.style.bottom=(12+jumpT)+'%'; if(jumpT==0){player.textContent='🏃‍♂️'; player.style.bottom='12%'}}
 requestAnimationFrame(loop);
}
loop();
let sx=0; wrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
wrap.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(dx>50) moveLane(1); else if(dx<-50) moveLane(-1); else jump();});
</script>
</body>
</html>
