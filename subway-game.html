<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:#1a1a2e;color:#fff;font-family:Arial;text-align:center;overflow:hidden}
#game{width:100%;max-width:400px;height:85vh;background:linear-gradient(#87CEEB,#e0e0e0);margin:auto;position:relative;overflow:hidden;border:4px solid #ffcc00}
.lane{position:absolute;width:33.3%;height:100%;border-right:1px dashed #ffffff44}
#player{position:absolute;bottom:80px;left:33.3%;font-size:45px;transition:left 0.15s;z-index:10}
.coin,.obs{position:absolute;font-size:30px}
#ui{display:flex;justify-content:space-between;padding:10px;max-width:400px;margin:auto;font-weight:bold;font-size:18px}
button{padding:12px 20px;margin:3px;border:none;border-radius:12px;font-weight:bold}
.c-btn{background:#ffcc00}.j-btn{background:#00ff88}
</style></head><body>
<div id="ui"><span>⭐ <b id="score">0</b></span><span>🪙 <b id="coins">0</b></span></div>
<div id="game">
<div class="lane" style="left:0"></div><div class="lane" style="left:33.3%"></div><div class="lane" style="left:66.6%"></div>
<div id="player">🏃‍♂️</div>
</div>
<div>
<button class="c-btn" onclick="move(-1)">⬅️ LEFT</button>
<button class="j-btn" onclick="jump()">⬆️ JUMP</button>
<button class="c-btn" onclick="move(1)">RIGHT ➡️</button>
</div>
<div><button onclick="startGame()" style="background:#ff0066;color:#fff;width:90%;margin-top:8px">▶️ START / RESTART</button></div>
<script>
let lane=1, score=0, coins=0, playing=false, objects=[], jumpT=0;
const lanes=[5,38,71]; // % positions
const player=document.getElementById('player');
const game=document.getElementById('game');
function move(d){ lane=Math.max(0,Math.min(2,lane+d)); player.style.left=lanes[lane]+'%' }
function jump(){ if(jumpT<=0){ jumpT=20; player.innerHTML='🦸‍♂️'; } }
function startGame(){
 score=0;coins=0;objects.forEach(o=>o.el.remove());objects=[];lane=1;
 document.getElementById('score').innerText=0;
 document.getElementById('coins').innerText=0;
 player.style.left=lanes[lane]+'%'; playing=true; loop();
}
function spawn(){
 let type=Math.random()<0.6?'coin':'obs';
 let l=Math.floor(Math.random()*3);
 let el=document.createElement('div');
 el.className=type; el.style.left=lanes[l]+'%'; el.style.top='-40px';
 el.innerHTML=type=='coin'?'🪙':'📦'; el.l=l;
 game.appendChild(el); objects.push({el, y:-40, l, type});
}
function loop(){
 if(!playing) return;
 if(Math.random()<0.08) spawn();
 for(let i=objects.length-1;i>=0;i--){
  let o=objects[i]; o.y+=5+score/200; o.el.style.top=o.y+'px';
  if(o.y>300 && o.y<380 && o.l==lane){
   if(o.type=='coin' && jumpT<15){ coins++; score+=10; document.getElementById('coins').innerText=coins; o.el.remove(); objects.splice(i,1); continue; }
   if(o.type=='obs' && jumpT<=0){ playing=false; alert('GAME OVER! Score: '+score+' Coins: '+coins); return; }
  }
  if(o.y>600){ o.el.remove(); objects.splice(i,1); if(o.type=='obs'){score+=5; document.getElementById('score').innerText=score; } }
 }
 if(jumpT>0){ jumpT--; if(jumpT==0) player.innerHTML='🏃‍♂️'; player.style.bottom=(80+jumpT*3)+'px'; } else player.style.bottom='80px';
 requestAnimationFrame(loop);
}
// swipe support
let sx=0; game.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
game.addEventListener('touchend',e=>{ let dx=e.changedTouches[0].clientX-sx; if(dx>50) move(1); else if(dx<-50) move(-1); else if(dx<20 && dx>-20) jump(); });
</script></body></html>
