<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Vishu Surfers 3D</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:Arial}
#game{width:100%;max-width:420px;height:100vh;margin:auto;background:linear-gradient(#4facfe 0%, #87CEEB 35%, #222 35%);position:relative;overflow:hidden}
#tracks{position:absolute;bottom:0;width:100%;height:70%;background:repeating-linear-gradient(90deg, #2b2b2b 0 32%, #555 32% 33%);transform:perspective(300px) rotateX(60deg);transform-origin:bottom}
#player{position:absolute;bottom:18%;left:50%;font-size:50px;z-index:10;transform:translateX(-50%);transition:left 0.15s}
.obj{position:absolute;transform:translateX(-50%);text-align:center}
#ui{position:absolute;top:0;width:100%;padding:12px;display:flex;justify-content:space-between;box-sizing:border-box;color:#fff;font-weight:bold;font-size:20px;z-index:20;text-shadow:0 2px 5px #000}
#ctrl{position:absolute;bottom:0;width:100%;display:flex;justify-content:space-around;padding:10px;box-sizing:border-box;z-index:20}
#ctrl button{padding:14px 22px;border:none;border-radius:12px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div id="game">
<div id="ui"><div>⭐ <span id="score">0</span></div><div>🪙 <span id="coins">0</span></div></div>
<div id="tracks"></div>
<div id="player">🏃‍♂️</div>
<div id="ctrl">
<button onclick="move(-1)" style="background:#ffcc00">⬅️</button>
<button onclick="jump()" style="background:#00ffaa">⬆️ JUMP</button>
<button onclick="move(1)" style="background:#ffcc00">➡️</button>
</div>
</div>
<script>
let lane=1, score=0, coins=0, list=[], jt=0;
const pos=[20,50,80];
const player=document.getElementById('player');
const game=document.getElementById('game');
function move(d){lane=Math.max(0,Math.min(2,lane+d)); player.style.left=pos[lane]+'%';}
function jump(){if(jt==0){jt=28; player.textContent='🦸‍♂️';}}
function addObj(){
 let isCoin=Math.random()<0.6;
 let l=Math.floor(Math.random()*3);
 let div=document.createElement('div'); div.className='obj';
 div.textContent=isCoin?'🪙':'🚃'; div.style.left=pos[l]+'%';
 div.style.top='5%'; div.dataset.l=l; div.dataset.t=isCoin?'coin':'train';
 game.appendChild(div); list.push({el:div,y:5,l,type:isCoin?'coin':'train'});
}
setInterval(addObj,700);
function loop(){
 for(let i=list.length-1;i>=0;i--){
  let o=list[i]; o.y+=1.3+score/600;
  o.el.style.top=o.y+'%'; o.el.style.fontSize=(10+o.y*0.8)+'px'; o.el.style.zIndex=Math.floor(o.y);
  if(o.y>65 && o.y<80 && o.l==lane){
   if(o.type=='coin' && jt<15){coins++;score+=5; o.el.remove(); list.splice(i,1);
    document.getElementById('coins').textContent=coins; document.getElementById('score').textContent=score; continue;}
   if(o.type=='train' && jt==0){alert('GAME OVER! Score: '+score); location.reload(); return;}
  }
  if(o.y>92){o.el.remove(); list.splice(i,1); if(o.type=='train'){score+=10; document.getElementById('score').textContent=score;}}
 }
 if(jt>0){jt--; player.style.bottom=(18+jt*0.8)+'%'; if(jt==0){player.textContent='🏃‍♂️'; player.style.bottom='18%';}}
 requestAnimationFrame(loop);
} loop();
let sx=0;
game.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
game.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(dx>40) move(1); else if(dx<-40) move(-1); else jump();});
</script>
</body>
</html>
