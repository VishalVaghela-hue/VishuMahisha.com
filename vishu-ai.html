<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISHU AI - Real ChatGPT</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#070707;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px;background:linear-gradient(90deg,#ff0040,#ff5e00);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}
.chat{flex:1;overflow-y:auto;padding:16px;padding-bottom:95px}
.msg{display:flex;gap:10px;margin:14px 0}
.avatar{width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:2px solid #ff0040;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:11px}
.user-msg{justify-content:flex-end}
.user-msg.bubble{background:linear-gradient(90deg,#ff0040,#ff5e00);border-radius:18px 18px 4px 18px}
.bubble{padding:12px 16px;max-width:83%;background:#1c1c1c;border-radius:18px 18px 18px 4px;font-size:14px;line-height:1.6;white-space:pre-wrap;border:1px solid #222}
.input-area{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#111;border-top:1px solid #222;display:flex;gap:8px}
#inp{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #333;background:#1e1e1e;color:#fff;outline:none;font-size:15px}
#send{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(90deg,#ff0040,#ff5e00);color:#fff;font-size:18px}
</style>
</head>
<body>
<header><div class="logo">VISHU AI 🤖 V2 - Real AI</div><div style="font-size:10px;background:#0008;padding:4px 8px;border-radius:10px">🔥 ChatGPT</div></header>
<div class="chat" id="chat">
<div class="msg"><div class="avatar">VM</div><div class="bubble"><b>VISHU AI V2 🔥🇮🇳 - REAL CHATGPT IS LIVE!</b>

Ab mai duniya ka koi bhi sawal bata sakta hu!
Shayari, Joke, Coding, Padhai, Story sab!

Bolo kya puchna hai?</div></div>
</div>
<div class="input-area">
<input id="inp" type="text" placeholder="Kuch bhi pucho...">
<button id="send">➤</button>
</div>
<script>
const API_KEY = "AQ.Ab8RN6It-MsNzB-TbDpRmbM5y1g1RWXjchcyNXJczlIPcytidA";
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), send=document.getElementById('send');
function add(t,c){
 let d=document.createElement('div');
 d.className='msg '+(c=='user'?'user-msg':'');
 d.innerHTML=c=='user'?`<div class="bubble">${t}</div>`:`<div class="avatar">VM</div><div class="bubble">${t}</div>`;
 chat.appendChild(d);
 chat.scrollTo(0,chat.scrollHeight);
 return d;
}
async function askAI(q){
 const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
 const body = {
  contents: [{ parts: [{ text: `You are VISHU AI, created by Vishu Mahisha from Mahudha, Gujarat, India. YouTube: @_vishal_creation_007_. You talk in cool Hinglish (Hindi+English mix), friendly, desi style, thoda funny. Answer user in same language they asked. User question: ${q}` }] }]
 };
 try{
  let res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  let data = await res.json();
  if(data.candidates && data.candidates[0]) return data.candidates[0].content.parts[0].text;
  else return "Error: " + JSON.stringify(data).substring(0,200);
 }catch(e){
  return "Bhai thoda network issue hai! Fir se try kar! Error: "+e.message;
 }
}
async function ask(){
 let q=inp.value.trim();
 if(!q)return;
 add(q,'user');
 inp.value='';
 let loading = add('VISHU AI soch raha hai... 🤔🔥','ai');
 let ans = await askAI(q);
 loading.remove();
 add(ans,'ai');
}
send.onclick=ask;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
</script>
</body>
</html>
