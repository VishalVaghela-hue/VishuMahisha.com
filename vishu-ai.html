<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISHU AI - Bharat Ka AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#070707;color:#fff;height:100vh;display:flex;flex-direction:column}
header{padding:14px 20px;background:linear-gradient(90deg,#ff0040,#ff5e00);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}
.badge{background:#00000066;padding:5px 12px;border-radius:20px;font-size:11px}
.chat{flex:1;overflow-y:auto;padding:16px;max-width:800px;margin:0 auto;width:100%}
.msg{display:flex;gap:10px;margin:14px 0}
.avatar{width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:2px solid #ff0040;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.user-msg{justify-content:flex-end}
.user-msg .bubble{background:linear-gradient(90deg,#ff0040,#ff5e00);border-radius:18px 18px 4px 18px}
.bubble{padding:12px 16px;max-width:75%;background:#1c1c1c;border-radius:18px 18px 18px 4px;font-size:14px;line-height:1.5}
.input-area{padding:12px;background:#111;border-top:1px solid #222;display:flex;gap:8px;max-width:800px;margin:0 auto;width:100%}
#inp{flex:1;padding:14px 18px;border-radius:25px;border:1px solid #333;background:#1e1e1e;color:#fff;outline:none}
#send{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(90deg,#ff0040,#ff5e00);color:#fff;font-size:18px}
.sug{padding:6px 12px;background:#1e1e1e;border:1px solid #333;border-radius:20px;font-size:12px;display:inline-block;margin:4px;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">VISHU AI 🤖</div><div class="badge">🔥 Official</div></header>
<div class="chat" id="chat">
<div class="msg"><div class="avatar">VM</div><div class="bubble">Hey! Mai hu <b>VISHU AI! 🇮🇳</b><br>Vishu Mahisha ka official AI! Bharat ka sabse tez AI! 💨<br><br>Bolo kya help chahiye?<br><br>
<span class="sug" onclick="askS('Vishu kaun hai?')">Vishu kaun hai?</span>
<span class="sug" onclick="askS('YouTube channel?')">YouTube?</span>
<span class="sug" onclick="askS('Joke sunao')">Joke 😂</span>
</div></div>
</div>
<div class="input-area">
<input id="inp" placeholder="VISHU AI se pucho...">
<button id="send">➤</button>
</div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), send=document.getElementById('send');
function add(t,c){let d=document.createElement('div');d.className='msg '+(c=='user'?'user-msg':'');d.innerHTML=c=='user'?`<div class="bubble">${t}</div>`:`<div class="avatar">VM</div><div class="bubble">${t}</div>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function getR(q){q=q.toLowerCase();if(q.includes('vishu')||q.includes('kaun'))return '<b>VISHU MAHISHA 🔥</b><br>Creator | YouTuber from Mahudha!<br>📺 @_vishal_creation_007_<br>1k Family Soon!';if(q.includes('youtube'))return '📺 Channel: https://youtube.com/@_vishal_creation_007_<br>Subscribe karo! 🔔';if(q.includes('joke'))return 'Pappu: ChatGPT kya hai?<br>Vishu: Jisse VISHU AI banta hai! 😂';return `Mast sawal! "${q}"<br>Abhi mai pro ban raha hu! Jaldi hi full ChatGPT jaisa jawab dunga! 🔥`;}
async function ask(){let q=inp.value.trim();if(!q)return;add(q,'user');inp.value='';setTimeout(()=>{add(getR(q),'ai')},600);}
function askS(t){inp.value=t;ask();}
send.onclick=ask;inp.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
</script>
</body>
</html>
