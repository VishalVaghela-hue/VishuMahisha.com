<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISHU AI - Bharat ka AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}
#header{padding:14px;text-align:center;background:linear-gradient(90deg,#6a11cb,#2575fc);font-weight:bold;font-size:22px;letter-spacing:1px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.4}
.user{align-self:flex-end;background:#2575fc;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#1e1e1e;border:1px solid #333;border-bottom-left-radius:4px}
#inputArea{display:flex;padding:10px;background:#111;gap:10px;border-top:1px solid #222}
#inp{flex:1;padding:12px 16px;border-radius:25px;border:none;background:#222;color:#fff;outline:none;font-size:16px}
#send{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(90deg,#6a11cb,#2575fc);color:#fff;font-size:20px}
#logo{font-size:40px;text-align:center;margin-top:20%;opacity:0.8}
</style>
</head>
<body>
<div id="header">🤖 VISHU AI</div>
<div id="chat">
<div id="logo">🤖<br><br>VISHU AI<br><span style="font-size:14px;opacity:0.6">Meta AI se bhi tez, Bharat ka AI</span></div>
</div>
<div id="inputArea">
<input id="inp" placeholder="VISHU AI se kuch pucho...">
<button id="send">➤</button>
</div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
const send=document.getElementById('send');
let logo=document.getElementById('logo');

function addMsg(t,c){
 if(logo) {logo.remove(); logo=null;}
 let d=document.createElement('div'); d.className='msg '+c; d.innerText=t;
 chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}

async function ask(){
 let q=inp.value.trim(); if(!q) return;
 addMsg(q,'user'); inp.value='';
 addMsg('Soch raha hu... 🤔','ai');
 
 // ---- YEHI PE AI KA DIMAG LAGEGA ----
 // Abhi ke liye demo jawab, baad me API lagayenge
 setTimeout(()=>{
  chat.lastChild.remove();
  let ans = "Mai VISHU AI hu! 🤖\n\nTune pucha: '"+q+"'\n\nAbhi mai demo mode me hu. Tu jab API key lagayega, tab mai Meta AI ki tarah har sawal ka jawab dunga, image banaunga, code likhunga!\n\nAPI lagane ke liye mujhe bol - 'API kaise lagau'";
  addMsg(ans,'ai');
 },800);
}

send.onclick=ask;
inp.addEventListener('keydown',e=>{if(e.key==='Enter') ask();});
</script>
</body>
</html>
