<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vishu AI - Chat + Photo</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}header{background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;text-align:center;font-weight:bold;position:fixed;top:0;left:0;right:0;z-index:10}#chat{flex:1;overflow-y:auto;padding:16px;padding-top:70px;padding-bottom:90px;display:flex;flex-direction:column;gap:12px;background:#111;margin-top:50px}.msg{max-width:90%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5}.user{align-self:flex-end;background:#667eea}.ai{align-self:flex-start;background:#222;border:1px solid #333}.ai img{max-width:100%;border-radius:12px;margin-top:8px}#box{position:fixed;bottom:20px;left:10px;right:10px;display:flex;padding:10px;gap:10px;background:#1e1e1e;border-radius:40px;align-items:center;border:2px solid #667eea;z-index:20}#q{flex:1;padding:14px 18px;border-radius:30px;border:none;background:#2a2a2a;color:#fff;outline:none}.cam{font-size:26px;background:#667eea;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}input[type=file]{display:none}button{padding:12px 18px;border-radius:30px;border:none;background:#667eea;color:#fff;font-weight:bold;cursor:pointer}</style>
</head>
<body>
<header>✨ Vishu AI - Meri Tarah Chat + Photo</header>
<div id="chat"><div class="msg ai">Hey Vishu! Mai Vishu AI hu! 🙏<br><br>Meri tarah baat kar sakta hai!<br><b>Chat:</b> "hello", "kaise ho"<br><b>Photo:</b> "ek gadi ka photo banao", "mera hd photo banao"<br><br>Bolo kya kaam hai?</div></div>
<div id="box">
<label for="file" class="cam">📷</label>
<input type="file" id="file" accept="image/*">
<input id="q" placeholder="Bolo Vishu..." onkeydown="if(event.key==='Enter')go()">
<button onclick="go()">Bhejo</button>
</div>
<script>
const C=document.getElementById('chat'), Q=document.getElementById('q'), F=document.getElementById('file');
let lastImgTime=0;
F.onchange=e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{add(`<b>Photo mil gaya!</b> Ab bolo iska kya karna hai? <br><img src="${r.result}">`,'ai');}; r.readAsDataURL(f);};
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t.replace(/\n/g,'<br>');C.appendChild(d);C.scrollTop=C.scrollHeight;return d;}

async function go(){
 let txt=Q.value.trim(); if(!txt)return;
 add(txt,'user'); Q.value='';
 let l=add('Soch raha hu...','ai');

 // Check if user wants photo
 let lower = txt.toLowerCase();
 let wantPhoto = lower.includes('photo') || lower.includes('image') || lower.includes('banao') || lower.includes('hd') || lower.includes('picture') || lower.includes('gadi') || lower.includes('car');

 if(wantPhoto){
   // PHOTO MODE
   let now=Date.now(); if(now-lastImgTime<50000){ C.removeChild(l); add(`⏳ 50 sec ruk ja Vishu! Photo limit hai. ${Math.ceil((50000-(now-lastImgTime))/1000)} sec baki. Tab tak baat karte hain!`,'ai'); return; } lastImgTime=now;
   try{
     let prompt = "realistic hd 8k ultra detailed " + txt;
     let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=false&seed=${Math.floor(Math.random()*10000)}&t=${Date.now()}`;
     let img = new Image(); img.onload=()=>{ C.removeChild(l); add(`Ye le Vishu! Tera photo ban gaya 🔥<br><img src="${imgUrl}"><br><a href="${imgUrl}" target="_blank" style="color:#667eea">Download HD</a>`,'ai'); }; img.onerror=()=>{ C.removeChild(l); add('Net slow hai, fir se bhejo dabao','ai'); lastImgTime=0; }; img.src=imgUrl;
   }catch(e){ C.removeChild(l); add('Photo error: '+e.message,'ai'); lastImgTime=0; }
 } else {
   // CHAT MODE - Meri tarah chat
   try{
     let res = await fetch('https://text.pollinations.ai/' + encodeURIComponent(txt + " - reply in hindi+english mix like a friend named Vishu AI, short friendly"));
     let data = await res.text();
     C.removeChild(l);
     add(data || "Haan Vishu bolo! Mai sun raha hu 😊 Kya haal hai?",'ai');
   }catch(e){
     C.removeChild(l);
     add("Haan Vishu! Mai yahin hu 🙏 Bolo kya kaam hai? Photo chahiye to 'photo banao' likh!","ai");
   }
 }
}
</script>
</body>
</html>
