<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vishu AI - Pro</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}header{background:linear-gradient(135deg,#667eea,#764ba2);padding:14px;text-align:center;font-weight:bold;display:flex;justify-content:center;gap:10px}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#111}.msg{max-width:90%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4}.user{align-self:flex-end;background:#667eea}.ai{align-self:flex-start;background:#222;border:1px solid #333}.ai img{max-width:100%;border-radius:12px;margin-top:8px}#box{display:flex;padding:10px;gap:8px;background:#000;align-items:center}#q{flex:1;padding:12px 16px;border-radius:30px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}button{padding:12px 16px;border-radius:30px;border:none;background:#667eea;color:#fff;font-weight:bold}input[type=file]{display:none}.icon{font-size:20px;cursor:pointer}</style>
</head>
<body>
<header>✨ Vishu AI - Text + Photo Editor <label for="file" class="icon">📷</label></header>
<div id="chat"><div class="msg ai">Namaste Vishu! 🙏<br><br>1. Text ke liye: Kuch bhi likh ke bhejo<br>2. Photo Edit ke liye: 📷 pe click karke photo select karo, fir bolo "is ko cartoon banao / background hatao / stylish banao"</div></div>
<div id="box">
<input type="file" id="file" accept="image/*">
<input id="q" placeholder="Text likho ya photo edit bolo..." onkeydown="if(event.key==='Enter')go()">
<button onclick="go()">Bhejo</button>
</div>
<script>
const C=document.getElementById('chat'), Q=document.getElementById('q'), F=document.getElementById('file');
let lastTime=0, selectedImage=null;
F.onchange=e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{selectedImage=r.result; add(`<b>Photo select ho gayi!</b><br><img src="${selectedImage}">`,'ai');}; r.readAsDataURL(f);};
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;C.appendChild(d);C.scrollTop=C.scrollHeight;return d;}
async function go(){
 let txt=Q.value.trim(); if(!txt &&!selectedImage)return;
 let now=Date.now(); if(now-lastTime<10000){add(`10 sec ruk ja ⏳ ${Math.ceil((10000-(now-lastTime))/1000)}s`,'ai');return;} lastTime=now;
 if(txt) add(txt,'user'); Q.value='';
 let l=add('Soch raha hu...','ai');
 try{
   if(selectedImage || txt.toLowerCase().includes('photo') || txt.toLowerCase().includes('image') || txt.toLowerCase().includes('banao')){
     // IMAGE GENERATE / EDIT
     let prompt = txt || 'stylish edit this photo, hd 4k';
     let imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?nologo=true&enhance=true&width=512&height=512&seed=${Math.floor(Math.random()*1000)}`;
     C.removeChild(l);
     add(`Ye le tera edited photo! 🔥<br><img src="${imgUrl}" onload="this.scrollIntoView()"><br><a href="${imgUrl}" target="_blank" style="color:#667eea">Download kar</a>`,'ai');
     selectedImage=null;
   } else {
     // TEXT AI
     let shortPrompt = `Tu Vishu ka dost hai. MAX 2-3 line me hinglish me jawab de. Sawal: ${txt}`;
     let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(shortPrompt));
     let data=await res.text();
     C.removeChild(l);
     if(data.includes('Free limit')) add('Server 30 sec mangta hai, thoda ruk ja bhai!','ai');
     else add(data.slice(0,400),'ai');
   }
 }catch(e){C.removeChild(l); add('Error: '+e.message,'ai');}
}
</script>
</body>
</html>
