<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#070707;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:16px 20px;background:linear-gradient(90deg,#ff0040,#ff5e00);display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(255,0,64,0.3)}

.chat{flex:1;overflow-y:auto;padding:20px;max-width:850px;margin:0 auto;width:100%;scroll-behavior:smooth}
.msg{display:flex;gap:12px;margin:18px 0;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.user-msg{justify-content:flex-end}
.user-msg .bubble{background:linear-gradient(90deg,#ff0040,#ff5e00);color:#fff;border-radius:18px 18px 4px 18px}
.ai-msg .avatar{background:#1a1a1a;border:2px solid #ff0040}
.ai-msg .bubble{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:18px 18px 18px 4px}
.bubble{padding:14px 18px;max-width:78%;line-height:1.6;font-size:15px;white-space:pre-wrap}
.bubble b{color:#ff5e00}
.typing{display:flex;gap:4px;padding:14px 18px;background:#1c1c1c;border-radius:18px;width:fit-content}
.dot{width:7px;height:7px;background:#ff0040;border-radius:50%;animation:bounce 1.4s infinite}
.dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.input-area{padding:14px;background:#111;border-top:1px solid #222;display:flex;gap:10px;max-width:850px;margin:0 auto;width:100%;align-items:center}
#inp{flex:1;padding:15px 20px;border-radius:30px;border:1px solid #333;background:#1e1e1e;color:#fff;outline:none;font-size:15px}
#inp:focus{border-color:#ff0040}
#send{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(90deg,#ff0040,#ff5e00);color:#fff;font-size:20px;cursor:pointer;transition:0.2s}
#send:hover{transform:scale(1.05)}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sug{padding:8px 14px;background:#1e1e1e;border:1px solid #333;border-radius:20px;font-size:13px;cursor:pointer;transition:0.2s}
.sug:hover{background:#ff0040;border-color:#ff0040}
footer{text-align:center;padding:8px;font-size:11px;opacity:0.4}
a{color:#ff5e00;text-decoration:none}
