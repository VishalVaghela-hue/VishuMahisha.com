<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vishu Bike Racing - Fixed</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
#gameBox{width:95%;max-width:400px;height:75vh;margin:auto;background:#222;position:relative;overflow:hidden;border:3px solid red;border-radius:15px}
.lane{position:absolute;top:0;width:4px;height:100%;background:white;left:33%}
.lane2{left:66%}
#bike{position:absolute;bottom:20px;left:42%;font-size:45px;z-index:10}
.enemy{position:absolute;font-size:40px;top:-60px}
.ctrlBtn{width:80px;height:80px;background:red;border-radius:50%;font-size:30px;border:3px solid white;margin:5px}
#startBtn{padding:15px 40px;background:yellow;color:red;border-radius:30px;font-weight:bold;border:none;font-size:20px;margin-top:10px}
</style>
</head>
<body>
<h3>🏍️ SCORE: <span id="score">0</span></h3>
<div id="gameBox"><div style="width:100%;height:100%;position:relative"><div class="lane"></div><div class="lane lane2"></div><div id="bike">🏍️</div><div id="road"></div></div></div>
<button class="ctrlBtn" onclick="move(-1)">⬅️</button>
<button class="ctrlBtn" onclick="move(1)">➡️</button>
<br>
<button id="startBtn" onclick="start()">▶️ START RACE</button>
<script>
let bike=document.getElementById('bike'),road=document.getElementById('road'),pos=1,positions=['15%','42%','70%'],score=0,gameOn=false;
function move(dir){pos+=dir;if(pos<0)pos=0;if(pos>2)pos=2;bike.style.left=positions[pos];}
function start(){score=0;document.getElementById('score').innerText=0;gameOn=true;document.querySelectorAll('.enemy').forEach(e=>e.remove());alert('Ready? Race Shuru!');loop();}
function loop(){if(!gameOn)return;if(Math.random()<0.08){let en=document.createElement('div');en.className='enemy';en.innerText=['🚗','🚕','🚙','🚌'][Math.floor(Math.random()*4)];let lane=Math.floor(Math.random()*3);en.style.left=positions[lane];road.appendChild(en);let top=-60;let id=setInterval(()=>{if(!gameOn){clearInterval(id);return;}top+=8;en.style.top=top+'px';if(top>400 && top<500 && positions[lane]==positions[pos]){gameOn=false;alert('💥 CRASH! Score:'+score);clearInterval(id);}if(top>600){en.remove();clearInterval(id);score+=10;document.getElementById('score').innerText=score;}},20);}setTimeout(loop,200);}
</script>
</body>
</html>
