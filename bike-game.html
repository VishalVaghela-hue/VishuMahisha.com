<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Game Final</title>
<style>
body{margin:0;background:black;color:white;text-align:center;font-family:Arial}
#box{width:95%;max-width:380px;height:70vh;background:#2b2b2b;margin:10px auto;border:3px solid red;position:relative;overflow:hidden;border-radius:10px}
#bike{position:absolute;bottom:10px;left:135px;font-size:40px;z-index:5}
.car{position:absolute;top:-50px;font-size:38px}
button{padding:12px 20px;margin:5px;font-size:18px;border-radius:10px;border:none;font-weight:bold}
#left{background:orange} #right{background:orange} #start{background:yellow;color:red;width:90%;margin-top:10px}
</style>
</head>
<body>
<h2>SCORE: <span id="sc">0</span></h2>
<div id="box"><div id="bike">🏍️</div></div>
<button id="left" onclick="goLeft()">LEFT</button>
<button id="right" onclick="goRight()">RIGHT</button><br>
<button id="start" onclick="startGame()">START RACE</button>
<script>
var bike = document.getElementById('box').children[0];
var box = document.getElementById('box');
var scoreEl = document.getElementById('sc');
var bikeX = 135;
var score = 0;
var playing = false;
var cars = [];
function goLeft(){ if(bikeX>10){bikeX-=70; bike.style.left=bikeX+'px';} }
function goRight(){ if(bikeX<280){bikeX+=70; bike.style.left=bikeX+'px';} }
function startGame(){
  score=0; scoreEl.innerHTML=0; playing=true;
  var allCars = document.querySelectorAll('.car');
  for(var i=0;i<allCars.length;i++) allCars[i].remove();
  cars=[];
  run();
}
function run(){
  if(!playing) return;
  if(Math.random()<0.07){
    var c = document.createElement('div');
    c.className='car';
    c.innerHTML='🚗';
    var lanes=[20,135,250];
    c.lane = Math.floor(Math.random()*3);
    c.style.left=lanes[c.lane]+'px';
    c.y=-50;
    box.appendChild(c);
    cars.push(c);
  }
  for(var i=cars.length-1;i>=0;i--){
    cars[i].y+=6;
    cars[i].style.top=cars[i].y+'px';
    if(cars[i].y>350 && cars[i].y<420){
      if(Math.abs(cars[i].y-350)<60){
        var bx = bikeX;
        var cx = [20,135,250][cars[i].lane];
        if(Math.abs(bx-cx)<50){ playing=false; alert('CRASH! Score='+score); return; }
      }
    }
    if(cars[i].y>500){ cars[i].remove(); cars.splice(i,1); score+=10; scoreEl.innerHTML=score; }
  }
  setTimeout(run,30);
}
</script>
</body>
</html>
